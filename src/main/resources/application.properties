spring.application.name=RespiraFacilAPI
# Configuracion de PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# URL del frontend
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=30

app.modelo.url=https://modelo-crisis-asmatica.onrender.com

spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never